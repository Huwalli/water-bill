<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
  <title>霓虹星塵</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <canvas id="game"></canvas>

  <!-- 上方資訊列 -->
  <div id="hud">
    <div>分數 <b id="score">0</b></div>
    <div>連擊 <b id="combo">x1</b></div>
    <div>最高 <b id="best">0</b></div>
    <div id="lives">♥♥♥</div>
  </div>

  <button id="muteBtn" title="音效開關">🔊</button>

  <!-- 開始 / 暫停 / 結束 畫面 -->
  <div id="overlay">
    <h1 id="title">霓虹星塵</h1>
    <p id="msg">滑鼠或手指左右移動，自動射擊<br>鍵盤：← → 或 A D　暫停：P</p>
    <button id="startBtn">開始遊戲</button>
  </div>

  <script src="script.js"></script>
</body>
</html>
